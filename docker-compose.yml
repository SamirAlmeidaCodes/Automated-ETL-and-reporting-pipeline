# The scheduler process is the long-running service. It stays up and runs the
# ETL on the cron in config.yaml. One-shot runs:
#   docker compose run --rm scheduler python -m etl

name: weather-etl

services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-etl:latest
    container_name: weather-etl-scheduler
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      ETL_CONFIG: /app/config.yaml
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; Path('/app/data/heartbeat.txt').read_text()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
